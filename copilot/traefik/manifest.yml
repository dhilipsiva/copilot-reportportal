name: traefik
type: Load Balanced Web Service

http:
  path: '/'
  healthcheck:
    path: '/ping'
    success_codes: '200,404'

image:
  build:
    dockerfile: ./traefik/Dockerfile
    context: ./traefik
  port: 80

cpu: 256
memory: 512
count: 1
exec: false
command: --configFile=/etc/traefik/traefik.yml
